name: Meet Angular Quality

on:
  pull_request:
    paths:
      - '.github/workflows/meet-quality.yml'
      - 'src/app/indomito-hub/meet/**'
      - 'src/app/app.routes.ts'
      - 'src/app/core/auth/**'
      - 'package*.json'
  push:
    branches:
      - feature/agenda-videollamadas

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build:dev
      - run: npm run check:buttons
