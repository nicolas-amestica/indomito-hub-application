<div class="min-h-screen bg-canvas text-ink">
  <header
    class="sticky top-0 z-40 border-b border-white/10 bg-[#171719]/95 text-white backdrop-blur-xl"
  >
    <div class="mx-auto flex max-w-[1500px] items-center gap-2 px-3 py-3 sm:gap-4 sm:px-8">
      <a routerLink="/cotizaciones" class="flex items-center gap-3">
        <img
          src="brand/logo-web-large.png"
          alt="Giras Indómito"
          width="768"
          height="391"
          class="h-9 w-auto object-contain dark:brightness-0 dark:invert"
        />
        <span class="hidden text-sm font-semibold sm:block">Indómito Hub</span>
      </a>
      <div class="ml-auto flex items-center gap-3">
        <button
          pButton
          type="button"
          severity="secondary"
          text
          rounded
          iconOnly
          class="text-white!"
          [attr.aria-label]="theme.label()"
          [pTooltip]="theme.label()"
          tooltipPosition="bottom"
          (click)="theme.toggle()"
        >
          <span [class]="theme.icon() + ' size-6'" aria-hidden="true"></span>
        </button>
        <button
          pButton
          type="button"
          severity="secondary"
          outlined
          class="border-white/20! text-white!"
          (click)="toggle()"
          aria-label="Abrir menú de módulos"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-brand"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span class="hidden sm:inline">Menú</span>
        </button>
        <div class="hidden border-l border-white/15 pl-3 text-right sm:block">
          <p class="text-sm font-semibold">{{ auth.user()?.name }}</p>
          <p class="text-xs text-white/55">{{ auth.user()?.profileCode }}</p>
        </div>
        <button
          type="button"
          class="rounded-xl px-2 py-2 text-sm text-white/70 hover:bg-white/10 hover:text-white sm:px-3"
          (click)="auth.logout()"
        >
          Salir
        </button>
      </div>
    </div>
  </header>

  <app-mega-menu [modules]="navigableModules()" [(visible)]="open" />
  <main><router-outlet /></main>
</div>
