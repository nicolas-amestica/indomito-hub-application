<div class="min-h-screen bg-canvas text-ink">
  <header
    class="sticky top-0 z-40 border-b border-white/10 bg-[#171719]/95 text-white backdrop-blur-xl"
  >
    <div class="mx-auto flex max-w-[1500px] items-center gap-2 px-3 py-3 sm:gap-4 sm:px-8">
      <a
        routerLink="/inicio"
        class="flex min-w-0 items-center gap-3"
        aria-label="Ir al inicio de Giras Indómito"
      >
        <img
          src="brand/logo-web-large.png"
          alt="Giras Indómito"
          width="768"
          height="391"
          class="h-9 w-auto object-contain dark:brightness-0 dark:invert"
        />
        <span class="hidden min-w-0 leading-tight sm:block">
          <span class="block text-sm font-semibold">Giras Indómito</span>
          <span class="block text-[11px] text-white/65">Una vuelta a la aventura</span>
        </span>
      </a>
      <div class="ml-auto flex items-center gap-3">
        <button
          pButton
          type="button"
          severity="secondary"
          text
          rounded
          iconOnly
          class="text-white! hover:bg-white/10! hover:text-white! dark:hover:bg-white/15!"
          [attr.aria-label]="theme.label()"
          [pTooltip]="theme.label()"
          tooltipPosition="bottom"
          (click)="theme.toggle()"
        >
          <span [class]="theme.icon() + ' size-6'" aria-hidden="true"></span>
        </button>
        <button
          pButton
          type="button"
          severity="secondary"
          outlined
          class="border-white/20! text-white! hover:border-white/35! hover:bg-white/10! hover:text-white! dark:hover:border-white/30! dark:hover:bg-white/15!"
          (click)="toggle()"
          aria-label="Abrir menú de módulos"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-brand"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span class="hidden sm:inline">Menú</span>
        </button>
        <div class="border-l border-white/15 pl-2 sm:pl-3">
          <app-user-profile-menu />
        </div>
      </div>
    </div>
  </header>

  <app-mega-menu [modules]="navigableModules()" [(visible)]="open" />
  <main class="min-w-0 max-w-full"><router-outlet /></main>
</div>
