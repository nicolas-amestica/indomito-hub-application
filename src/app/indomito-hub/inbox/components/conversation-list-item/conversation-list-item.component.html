<button
  pButton
  type="button"
  text
  severity="secondary"
  class="group flex min-h-19 w-full min-w-0 items-center gap-3 border-b border-line/75 px-4 py-3 text-left transition-colors focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-green-600 dark:border-line/55"
  [class.bg-surface-100]="selected()"
  [class.dark:bg-surface-800]="selected()"
  [class.hover:bg-surface-50]="!selected()"
  [class.dark:hover:bg-surface-900]="!selected()"
  [attr.aria-pressed]="selected()"
  (click)="selectedConversation.emit(conversation().phone)"
>
  <span class="flex size-12 shrink-0 items-center justify-center rounded-full bg-surface-200 text-sm font-semibold text-surface-700 dark:bg-surface-700 dark:text-surface-100">
    {{ initials() }}
  </span>
  <span class="min-w-0 flex-1">
    <span class="flex items-center justify-between gap-2">
      <span class="min-w-0 truncate text-sm font-semibold text-ink">{{ conversation().alias || conversation().phone }}</span>
      <span class="shrink-0 text-xs" [class.text-green-700]="conversation().unreadCount > 0" [class.dark:text-green-400]="conversation().unreadCount > 0" [class.text-muted]="conversation().unreadCount === 0">{{ time() }}</span>
    </span>
    <span class="mt-1 flex items-center justify-between gap-2">
      <span class="min-w-0 truncate text-sm text-muted">{{ conversation().lastMessagePreview || '—' }}</span>
      @if (conversation().unreadCount > 0) {
        <span
          class="flex min-w-5 shrink-0 items-center justify-center rounded-full bg-green-500 px-1.5 py-0.5 text-xs font-semibold text-white"
          [attr.aria-label]="conversation().unreadCount + ' mensajes no leídos'"
        >
          {{ conversation().unreadCount > 99 ? '99+' : conversation().unreadCount }}
        </span>
      }
    </span>
  </span>
</button>
