<main class="mx-auto max-w-5xl px-4 py-8 sm:px-8">
  <header class="rounded-3xl bg-ink p-7 text-white">
    <p class="text-xs font-bold uppercase tracking-[.2em] text-brand">Administración</p>
    <h1 class="mt-3 text-3xl font-semibold">Configuración de la aplicación</h1>
    <p class="mt-2 max-w-2xl text-white/60">
      Define los porcentajes que se aplicarán a los nuevos cálculos de programas.
    </p>
  </header>

  <form
    class="mt-6 grid gap-6 rounded-3xl border border-black/10 bg-white p-6 shadow-sm"
    (ngSubmit)="save()"
  >
    <div class="grid gap-5 md:grid-cols-2">
      <label class="grid gap-2">
        <span class="font-semibold text-ink">IVA para servicios</span>
        <span class="text-sm text-black/55">Se desglosa desde el precio final informado.</span>
        <div class="relative">
          <input
            class="iam-input w-full pr-12"
            name="vatRate"
            type="number"
            min="0"
            max="100"
            step="0.01"
            required
            [(ngModel)]="form.vatRate"
          />
          <span
            class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 font-semibold text-black/45"
            >%</span
          >
        </div>
      </label>
      <label class="grid gap-2">
        <span class="font-semibold text-ink">Retención para tripulación</span>
        <span class="text-sm text-black/55"
          >Se calcula sobre el honorario bruto de la tripulación.</span
        >
        <div class="relative">
          <input
            class="iam-input w-full pr-12"
            name="crewWithholdingRate"
            type="number"
            min="0"
            max="100"
            step="0.01"
            required
            [(ngModel)]="form.crewWithholdingRate"
          />
          <span
            class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 font-semibold text-black/45"
            >%</span
          >
        </div>
      </label>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-4 border-t border-black/10 pt-5">
      <p class="text-sm text-black/55">
        Los programas ya guardados conservan sus porcentajes y montos históricos.
      </p>
      <button
        class="rounded-xl bg-brand px-6 py-3 font-bold text-ink transition hover:brightness-95 disabled:opacity-50"
        [disabled]="saving()"
      >
        {{ saving() ? 'Guardando…' : 'Guardar configuración' }}
      </button>
    </div>
    @if (saved()) {
      <p role="status" class="rounded-xl bg-brand/20 px-4 py-3 text-sm font-semibold text-ink">
        Configuración guardada correctamente.
      </p>
    }
  </form>
</main>
