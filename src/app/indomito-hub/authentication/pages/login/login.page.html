<main class="relative grid min-h-screen place-items-center overflow-hidden bg-night px-5 py-12">
  <div
    class="absolute -right-24 -top-24 size-[34rem] rounded-full border-[6rem] border-brand/10"
  ></div>
  <div class="absolute -bottom-48 -left-48 size-[32rem] rounded-full bg-brand/5 blur-3xl"></div>
  <section
    class="relative w-full max-w-md rounded-[2rem] border border-white/10 bg-white/[.06] p-7 shadow-2xl backdrop-blur-xl sm:p-10"
  >
    <img src="brand/logo-web-large.png" alt="Giras Indómito" width="289" height="56" class="h-14 w-auto" />
    <p class="mt-10 text-xs font-bold uppercase tracking-[.25em] text-brand">Acceso ejecutivo</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight text-white">Bienvenido a Indómito Hub</h1>
    <p class="mt-2 text-sm leading-6 text-white/55">Ingresa con tu RUT o correo corporativo.</p>
    <form class="mt-8 grid gap-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="grid gap-2 text-sm font-semibold text-white/80"
        >RUT o correo<input
          formControlName="login"
          autocomplete="username"
          placeholder="RUT o correo corporativo"
          class="h-12 rounded-xl border border-white/15 bg-black/20 px-4 text-white outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" /></label
      ><label class="grid gap-2 text-sm font-semibold text-white/80"
        >Clave<input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Ingresa tu clave"
          class="h-12 rounded-xl border border-white/15 bg-black/20 px-4 text-white outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
      /></label>
      @if (error()) {
        <p
          role="alert"
          class="rounded-xl border border-red-400/25 bg-red-400/10 px-4 py-3 text-sm text-red-100"
        >
          {{ error() }}
        </p>
      }
      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        class="mt-2 h-12 rounded-xl bg-brand font-bold text-night transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-40"
      >
        {{ loading() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
