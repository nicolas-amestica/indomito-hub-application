<header class="rounded-2xl bg-night p-5 sm:p-6">
  <img
    src="brand/logo-web-large.png"
    alt="Giras Indómito"
    width="289"
    height="56"
    fetchpriority="high"
    class="h-9 w-auto max-w-full object-contain sm:h-10"
  />
  <div class="mt-6 flex min-w-0 flex-col gap-5 sm:flex-row sm:items-start sm:justify-between">
    <div class="min-w-0">
      @if (context()) {
        <p class="text-sm text-white/75">{{ context() }}</p>
      }
      <h1 class="mt-2 break-words text-3xl font-semibold text-balance text-white sm:text-4xl">
        {{ title() }}
      </h1>
      @if (description()) {
        <p class="mt-3 max-w-2xl text-sm leading-6 text-white/75">{{ description() }}</p>
      }
    </div>
    <ng-content select="[headerActions]" />
  </div>
</header>
