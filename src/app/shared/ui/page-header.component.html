<header
  class="relative isolate overflow-hidden rounded-3xl bg-ink px-5 py-5 shadow-[0_24px_70px_-38px_rgba(28,28,28,0.8)] sm:px-8 sm:py-7"
>
  <div
    aria-hidden="true"
    class="absolute -right-16 -top-24 size-72 rounded-full border-[48px] border-brand/8"
  ></div>
  <div
    aria-hidden="true"
    class="absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-brand/70 to-transparent"
  ></div>

  <div class="relative flex items-center justify-between gap-6 border-b border-white/10 pb-5">
    <img
      ngSrc="brand/logo-web-large.png"
      alt="Giras Indómito"
      width="768"
      height="391"
      priority
      class="h-9 w-auto object-contain sm:h-10"
    />
    <span class="hidden items-center gap-2 text-xs font-medium tracking-wide text-white/55 sm:flex">
      <span
        aria-hidden="true"
        class="size-1.5 rounded-full bg-brand shadow-[0_0_12px_rgba(235,255,0,0.65)]"
      ></span>
      Indómito Hub
    </span>
  </div>

  <div class="relative mt-7 flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between">
    <div class="min-w-0 max-w-3xl">
      <div
        class="mb-3 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.18em] text-brand"
      >
        <span aria-hidden="true" class="h-px w-8 bg-brand"></span>
        {{ eyebrow() }}
      </div>
      <h1
        class="text-balance text-3xl font-semibold tracking-[-0.035em] text-white sm:text-4xl lg:text-[2.75rem]"
      >
        {{ title() }}
      </h1>
      <p class="mt-3 max-w-2xl text-pretty text-sm leading-6 text-white/65 sm:text-base">
        {{ description() }}
      </p>
    </div>
    <div class="flex shrink-0 flex-wrap gap-2"><ng-content /></div>
  </div>
</header>
