<header
  class="flex flex-col gap-5 border-b border-line pb-6 sm:flex-row sm:items-end sm:justify-between"
>
  <div class="max-w-2xl">
    <div
      class="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-muted"
    >
      <span aria-hidden="true" class="h-1 w-6 rounded-full bg-graphite"></span>
      {{ eyebrow() }}
    </div>
    <h1 class="text-3xl font-semibold tracking-tight text-ink sm:text-4xl">{{ title() }}</h1>
    <p class="mt-2 text-sm leading-relaxed text-muted">{{ description() }}</p>
  </div>
  <div class="flex shrink-0 flex-wrap gap-2"><ng-content /></div>
</header>
