@if (visible()) {
  <button
    @fadeOverlayMotion
    type="button"
    [attr.aria-label]="closeAriaLabel()"
    class="fixed inset-0 z-30 bg-night/35 backdrop-blur-[1px] md:hidden"
    (click)="visible.set(false)"
  ></button>

  <aside
    @slidePanelMotion
    role="dialog"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-busy]="loading()"
    [class]="panelClasses()"
  >
    <header class="relative overflow-hidden border-b border-line px-4 py-4">
      <div
        aria-hidden="true"
        class="pointer-events-none absolute -right-10 -top-14 size-36 rounded-full bg-brand/15 blur-3xl"
      ></div>

      <div class="relative flex min-h-10 items-start gap-2">
        @if (collapsible()) {
          <button
            pButton
            appMotionPress
            type="button"
            severity="secondary"
            text
            class="hidden md:inline-flex"
            [attr.aria-label]="collapsed() ? 'Expandir panel lateral' : 'Contraer panel lateral'"
            [title]="collapsed() ? 'Expandir panel' : 'Contraer panel'"
            (click)="collapsed.set(!collapsed())"
          >
            {{ collapsed() ? '‹' : '›' }}
          </button>
        }

        @if (!collapsed()) {
          <div class="min-w-0 flex-1">
            @if (eyebrow()) {
              <p class="text-[0.6875rem] font-semibold uppercase tracking-[0.16em] text-graphite">
                {{ eyebrow() }}
              </p>
            }
            <div class="mt-1 flex items-center gap-2.5">
              <span
                aria-hidden="true"
                class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-brand text-base text-night shadow-sm"
                >★</span
              >
              <div class="min-w-0">
                <h2 class="truncate text-lg font-semibold tracking-tight text-ink">
                  {{ title() }}
                </h2>
                @if (description()) {
                  <p class="mt-0.5 truncate text-xs text-muted">{{ description() }}</p>
                }
              </div>
            </div>
          </div>
        }

        <button
          pButton
          appMotionPress
          type="button"
          severity="secondary"
          text
          [attr.aria-label]="closeAriaLabel()"
          title="Cerrar panel"
          (click)="visible.set(false)"
        >
          ×
        </button>
      </div>
    </header>

    @if (collapsed()) {
      <div class="hidden min-h-0 flex-1 flex-col items-center gap-3 p-3 md:flex">
        <ng-content select="[drawer-collapsed]" />
      </div>
    } @else {
      <div class="flex min-h-0 flex-1 flex-col">
        <ng-content />
      </div>
    }
  </aside>
}
